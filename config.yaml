# LiteLLM proxy configuration — Google AI Studio (Gemini)
# Run with: litellm --config config.yaml --port 4000
# The key is read from .env (GOOGLE_API_KEY), never inlined here.

model_list:
  # --- Chat ---
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GOOGLE_API_KEY

  # Stable fallback tier
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY

  # --- Embeddings ---
  - model_name: gemini-embedding
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GOOGLE_API_KEY

litellm_settings:
  # Silently drop OpenAI params Gemini does not support instead of erroring
  drop_params: true
  # Retry transient upstream failures before surfacing an error
  num_retries: 2
  request_timeout: 600
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - gemini-pro: ["gemini-2.5-pro", "gemini-flash"]
    - gemini-flash: ["gemini-2.5-flash", "gemini-flash-lite"]
    - gemini-flash-lite: ["gemini-2.5-flash"]

general_settings:
  # Required: every request must send `Authorization: Bearer $LITELLM_MASTER_KEY`.
  # The proxy refuses to start without it. Value lives in .env.
  master_key: os.environ/LITELLM_MASTER_KEY
  health_check_interval: 300
